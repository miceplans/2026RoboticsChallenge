# EC2 에서 실행. /opt/app/.env 에 값 필요 (docs/deploy.md 참고)
services:
  web:
    image: ${ECR}/robotics-web:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_DOMAIN: .${DOMAIN}
      REALTIME_URL: http://realtime:4000   # 로그인·세션 검증은 realtime 에 서버 간 호출 (DB 는 realtime 만 연다)
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}   # /auth/* 공유 비밀 — 운영 필수
  realtime:
    image: ${ECR}/robotics-realtime:${RT_TAG:-latest}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      CORS_ORIGINS: https://${DOMAIN},https://judge.${DOMAIN},https://admin.${DOMAIN}
      DB_PATH: /data/contest.db
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      JUDGE_INITIAL_PASSWORD: ${JUDGE_INITIAL_PASSWORD:-}
    volumes:
      - /data/realtime:/data   # 별도 EBS 볼륨 (스냅샷 대상)
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  caddy_data:
