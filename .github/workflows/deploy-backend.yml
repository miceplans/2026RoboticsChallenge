name: deploy-backend
# 백엔드(realtime 서버 + SQLite 스키마/시드) 변경 시에만 realtime 컨테이너를 갱신한다.
# web 이미지는 건드리지 않는다 (web 변경은 deploy.yml).
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy   # deploy.yml 과 같은 그룹 — 동시에 서버를 건드리지 않게 직렬화

env:
  AWS_REGION: ap-northeast-2

jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push realtime
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/robotics-realtime:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/robotics-realtime:latest
          cache-from: type=gha,scope=rt
          cache-to: type=gha,scope=rt,mode=max

      - name: Deploy realtime via SSM
        run: |
          B64() { base64 -w0 "$1"; }
          CMDS=$(jq -nc \
            --arg c "$(B64 deploy/docker-compose.yml)" \
            --arg f "$(B64 deploy/Caddyfile)" \
            --arg d "$(B64 deploy/deploy.sh)" \
            --arg tag "${{ github.sha }}" \
            '[ "set -e", "cd /opt/app",
               "echo \($c) | base64 -d > docker-compose.yml",
               "echo \($f) | base64 -d > Caddyfile",
               "echo \($d) | base64 -d > deploy.sh && chmod +x deploy.sh",
               "./deploy.sh \($tag) realtime" ]')
          ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=robotics-app" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$CMDS" \
            --query Command.CommandId --output text)
          INSTANCE=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=robotics-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE" || {
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
            exit 1
          }
