name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXT_PUBLIC_REALTIME_URL=https://rt.${{ vars.DOMAIN }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/robotics-web:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/robotics-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build & push realtime
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/robotics-realtime:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/robotics-realtime:latest
          cache-from: type=gha,scope=rt
          cache-to: type=gha,scope=rt,mode=max

      - name: Deploy via SSM
        run: |
          # compose/Caddyfile/deploy.sh 를 레포에서 서버로 동기화한 뒤 재시작
          B64() { base64 -w0 "$1"; }
          CMDS=$(jq -nc \
            --arg c "$(B64 deploy/docker-compose.yml)" \
            --arg f "$(B64 deploy/Caddyfile)" \
            --arg d "$(B64 deploy/deploy.sh)" \
            --arg tag "${{ github.sha }}" \
            '[ "set -e", "cd /opt/app",
               "echo \($c) | base64 -d > docker-compose.yml",
               "echo \($f) | base64 -d > Caddyfile",
               "echo \($d) | base64 -d > deploy.sh && chmod +x deploy.sh",
               "./deploy.sh \($tag)" ]')
          ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=robotics-app" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$CMDS" \
            --query Command.CommandId --output text)
          INSTANCE=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=robotics-app Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE" || {
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
            exit 1
          }
